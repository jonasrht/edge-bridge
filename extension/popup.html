<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #fff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3; --ok: #1a7f37; --off: #9a6700; --accent: #0e639c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #202124; --fg: #e8e8e8; --muted: #a0a0a0; --line: #3a3b3e; --ok: #4ac26b; --off: #d4a72c; --accent: #4aa3e0; } }
    body { margin: 0; width: 300px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
    main { padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
    .dot.connected { background: var(--ok); }
    .status { color: var(--muted); display: flex; align-items: center; gap: 8px; }
    label { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-weight: 600; }
    select { width: 100%; text-overflow: ellipsis; }
    input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
    button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
    button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/32.png" alt="">Edge Bridge</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">…</span></div>
    <label><span data-i18n="labelName"></span>
      <input type="text" id="label" data-i18n-placeholder="labelPlaceholder" maxlength="40">
    </label>
    <p class="hint" id="email"></p>
    <div class="row">
      <span data-i18n="labelEnabled"></span>
      <input type="checkbox" id="enabled">
    </div>
    <label><span data-i18n="labelTabMode"></span>
      <select id="tabMode">
        <option value="group" data-i18n="tabModeGroup"></option>
        <option value="window" data-i18n="tabModeWindow"></option>
      </select>
    </label>
    <div class="row">
      <button id="showWindow" data-i18n="showTabs"></button>
    </div>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
